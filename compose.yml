services:
  postgres:
    image: postgres:18-alpine
    container_name: messgr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messgr
      POSTGRES_PASSWORD: messgr
      POSTGRES_DB: control
    ports:
      - "5432:5432"
    volumes:
      - messgr-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messgr -d control"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: messgr-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: messgr-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  messgr-pgdata:
