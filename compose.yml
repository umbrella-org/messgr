services:
  postgres:
    image: postgres:18-alpine
    container_name: messgr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messgr
      POSTGRES_PASSWORD: messgr
      POSTGRES_DB: control
    ports:
      - "5432:5432"
    volumes:
      - messgr-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messgr -d control"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  messgr-pgdata:
