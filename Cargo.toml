[package]
name = "messgr"
version = "0.2.0"
edition = "2024"

[lib]
name = "messgr"
path = "src/lib.rs"

[[bin]]
name = "messgr-control"
path = "src/bin/control.rs"

[[bin]]
name = "messgr-ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "messgr-dispatcher"
path = "src/bin/dispatcher.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
  "chrono",
  "migrate",
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vaultrs = "0.8"
async-trait = "0.1"
zeroize = "1"
base64 = "0.23"
url = "2"
lru = "0.18"
hmac = "0.13"
sha2 = "0.11"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = "0.5"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
x509-parser = "0.18"
aes-gcm = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.10"

[dev-dependencies]
wiremock = "0.6"
