name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: extractions/setup-just@v4
      - run: just fmt-check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just lint

  test:
    runs-on: ubuntu-latest
    env:
      CONTROL_DATABASE_URL: postgres://messgr:messgr@localhost:5432/control
      DATABASE_MAX_CONNECTIONS: 20
      MESSGR_PROFILE: dev
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: messgr-dev-root-token
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: messgr
          POSTGRES_PASSWORD: messgr
          POSTGRES_DB: control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messgr -d control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      vault:
        image: hashicorp/vault:latest
        env:
          VAULT_DEV_ROOT_TOKEN_ID: messgr-dev-root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just build
      - run: just control-migrate
      - name: Create messgr_cold tablespace (T-014's partition_lifecycle tests need it)
        run: just tablespace-init ${{ job.services.postgres.id }}
      - name: Wait for Vault, then bootstrap fixture mounts + approle auth (just vault-dev-init)
        run: |
          for i in $(seq 1 30); do curl -sf "$VAULT_ADDR/v1/sys/health" && break; sleep 1; done
          just vault-dev-init
      # The two-tenant isolation suite this build step is required to have
      # (DESIGN.md §14: "From step 0b onward, CI runs a two-tenant
      # integration suite").
      - run: just test
