name: Playwright API Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://messgr:messgr@localhost:5432/messgr
      SERVER_ADDR: 0.0.0.0:8888
      API_BASE_URL: http://localhost:8888
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: messgr
          POSTGRES_PASSWORD: messgr
          POSTGRES_DB: messgr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messgr -d messgr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: |
          ./target/debug/messgr &
          for i in $(seq 1 30); do
            curl -sf "$API_BASE_URL/send/sms" > /dev/null && exit 0
            sleep 1
          done
          echo "app did not become ready" >&2
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: tests/api
      - run: npx playwright test
        working-directory: tests/api
