<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SMS Messages</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>SMS Messages</h1>
  </header>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
      <path d="M14 14L11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <label for="q" class="visually-hidden">Search messages</label>
    <input
      id="q"
      type="search"
      name="q"
      placeholder="Search sender, recipient, or message…"
      hx-get="/sms/search"
      hx-trigger="input changed delay:300ms, search"
      hx-target="#results"
    >
  </div>

  <div id="results" hx-get="/sms/search" hx-trigger="load"></div>
</body>
</html>
